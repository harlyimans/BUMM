<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
<title>Product Segment Section — BUMM Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">
<style>
:root {
  --bumm-bg: #fcf7f7;
  --bumm-ink: #1c1213;
  --bumm-ink-muted: #706566;
  --bumm-line: #eddfdf;
  --bumm-accent: #d61f26;
  --bumm-accent-dim: #a8141c;
  --bumm-radius-md: 14px;
  --bumm-shadow-sm: 0 1px 2px rgba(28,18,19,.06), 0 6px 16px rgba(28,18,19,.07);
  --bumm-shadow-md: 0 2px 4px rgba(28,18,19,.06), 0 14px 30px rgba(28,18,19,.13);
  --font-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bumm-bg);
  color: var(--bumm-ink);
  font-family: var(--font-body);
}
.container { max-width: 1200px; margin: 0 auto; padding: 0 1.25rem; }

.bumm-eyebrow {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: .78rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--bumm-accent);
  margin-bottom: .5rem;
}
.bumm-heading {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.5rem, 2.4vw, 2.1rem);
  margin: 0 0 .75rem;
  color: var(--bumm-ink);
}
.bumm-lead {
  color: var(--bumm-ink-muted);
  max-width: 46rem;
  margin: 0 0 2rem;
  line-height: 1.6;
}

/* ============ PRODUCT SEGMENT CARDS ============ */
.bumm-segments { padding: 3.5rem 0; }

.bumm-segment-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1.1rem;
}

.bumm-segment-card {
  display: flex;
  flex-direction: column;
  background-color: #fff;
  border-radius: var(--bumm-radius-md);
  overflow: hidden;
  box-shadow: var(--bumm-shadow-sm);
  text-decoration: none;
  transition: transform .2s ease, box-shadow .2s ease;
  cursor: pointer;
}

.bumm-segment-card:hover { transform: translateY(-4px); box-shadow: var(--bumm-shadow-md); }

.bumm-segment-card-image { width: 100%; background: #fff; }
/* Fixed ratio (the PNGs differ by 1px) so every Learn More row lines up;
   the shadow lives on the card, not on the opaque image. */
.bumm-segment-card-image img {
  width: 100%;
  aspect-ratio: 198 / 258;
  object-fit: cover;
  display: block;
}

.bumm-segment-card-footer {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: .5rem;
  margin-top: auto;
  padding: .6rem 1rem 1.1rem;
}

.bumm-segment-card-link {
  font-size: .8rem;
  font-weight: 700;
  color: var(--bumm-accent-dim);
  text-decoration: underline;
  text-underline-offset: 2px;
}

.bumm-segment-card-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.6rem;
  height: 1.6rem;
  border-radius: 50%;
  border: 1px solid var(--bumm-accent-dim);
  color: var(--bumm-accent-dim);
  font-size: .7rem;
  flex-shrink: 0;
}

@media (max-width: 991.98px) {
  .bumm-segment-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .bumm-segment-card { grid-column: span 2; }
  .bumm-segment-card:nth-child(4) { grid-column: 2 / span 2; }
}
@media (max-width: 575.98px) {
  .bumm-segments { padding: 2.5rem 0; }
  .bumm-segment-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
  .bumm-segment-card,
  .bumm-segment-card:nth-child(4) { grid-column: auto; }
  .bumm-segment-card:last-child:nth-child(odd) { grid-column: 1 / -1; justify-self: center; width: calc(50% - .375rem); }
}
</style>
</head>
<body>

<section class="bumm-segments">
  <div class="container">
    <p class="bumm-eyebrow">Product</p>
    <h2 class="bumm-heading">Cast for the systems that keep running.</h2>
    <p class="bumm-lead">Five industry segments of iron cast components, engineered and finished to the tolerances each production line requires.</p>
  </div>

  <div class="container mt-4">
    <div class="bumm-segment-grid">

      <a href="../../product/automotive.html" class="bumm-segment-card">
        <div class="bumm-segment-card-image">
          <img src="img/card-automotive.png" alt="Automotive parts">
        </div>
        <div class="bumm-segment-card-footer">
          <span class="bumm-segment-card-link">Learn More</span>
          <span class="bumm-segment-card-arrow" aria-hidden="true"><i class="bi bi-arrow-right"></i></span>
        </div>
      </a>

      <a href="../../product/" class="bumm-segment-card">
        <div class="bumm-segment-card-image">
          <img src="img/card-agriculture.png" alt="Agriculture parts">
        </div>
        <div class="bumm-segment-card-footer">
          <span class="bumm-segment-card-link">Learn More</span>
          <span class="bumm-segment-card-arrow" aria-hidden="true"><i class="bi bi-arrow-right"></i></span>
        </div>
      </a>

      <a href="../../product/heavy-duty.html" class="bumm-segment-card">
        <div class="bumm-segment-card-image">
          <img src="img/card-heavy-duty.png" alt="Heavy Duty parts">
        </div>
        <div class="bumm-segment-card-footer">
          <span class="bumm-segment-card-link">Learn More</span>
          <span class="bumm-segment-card-arrow" aria-hidden="true"><i class="bi bi-arrow-right"></i></span>
        </div>
      </a>

      <a href="../../product/" class="bumm-segment-card">
        <div class="bumm-segment-card-image">
          <img src="img/card-general-casting.png" alt="General Casting parts">
        </div>
        <div class="bumm-segment-card-footer">
          <span class="bumm-segment-card-link">Learn More</span>
          <span class="bumm-segment-card-arrow" aria-hidden="true"><i class="bi bi-arrow-right"></i></span>
        </div>
      </a>

      <a href="../../product/" class="bumm-segment-card">
        <div class="bumm-segment-card-image">
          <img src="img/card-train.png" alt="Train Component parts">
        </div>
        <div class="bumm-segment-card-footer">
          <span class="bumm-segment-card-link">Learn More</span>
          <span class="bumm-segment-card-arrow" aria-hidden="true"><i class="bi bi-arrow-right"></i></span>
        </div>
      </a>

    </div>
  </div>
</section>

</body>
</html>
