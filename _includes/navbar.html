<!-- ============ NAVBAR ============ -->
  <!-- Satu navbar untuk semua halaman. Menu diatur di _data/navigation.yml.
       Front matter: `nav: <id>` menandai menu aktif,
                     `navbar_overlay: true` = transparan di atas hero (dipakai beranda). -->
  <nav class="navbar navbar-expand-lg bumm-navbar {% if page.navbar_overlay %}bumm-navbar--overlay{% else %}sticky-top{% endif %}">
    <div class="container">
      <a class="navbar-brand" href="{{ '/' | relative_url }}">BUMM</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#bummNav" aria-controls="bummNav" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="bummNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          {%- for item in site.data.navigation.main %}
          {%- unless item.hidden %}
          <li class="nav-item"><a class="nav-link{% if page.nav == item.id %} active{% endif %}" href="{{ item.url | relative_url }}"{% if page.nav == item.id %} aria-current="page"{% endif %} data-i18n="{{ item.i18n }}">{{ item.label }}</a></li>
          {%- endunless %}
          {%- endfor %}
          <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
            <div class="bumm-lang-switch" role="group" aria-label="Language switch">
              <button type="button" class="bumm-lang-btn is-active" data-lang="en">EN</button>
              <button type="button" class="bumm-lang-btn" data-lang="id">ID</button>
            </div>
          </li>
          <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
            <button type="button" class="bumm-theme-toggle" aria-pressed="false" aria-label="Switch to dark mode" data-label="Dark mode">
              <i class="bi bi-moon-stars" aria-hidden="true"></i>
            </button>
          </li>
          <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
            <a href="{{ '/#contact' | relative_url }}" class="btn btn-bumm-outline" data-i18n="contact_us">Contact Us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
