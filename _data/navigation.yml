# Satu sumber untuk menu navbar & footer.
# id   : dicocokkan dengan `nav:` di front matter halaman (untuk menandai menu aktif)
# hidden: true = disembunyikan dari menu (mis. halaman belum siap)
main:
  - { id: home,    label: Home,    i18n: nav_home,    url: "/" }
  - { id: career,  label: Career,  i18n: nav_career,  url: "/career/" }
  - { id: about,   label: About,   i18n: nav_about,   url: "/about/company-profile/" }
  - { id: product, label: Product, i18n: nav_product, url: "/product/" }
  - { id: news,    label: News,    i18n: nav_news,    url: "/news/", hidden: true }

footer:
  - { id: about,   label: About,   i18n: nav_about,   url: "/about/company-profile/" }
  - { id: career,  label: Career,  i18n: nav_career,  url: "/career/" }
  - { id: product, label: Product, i18n: nav_product, url: "/product/" }
  - { id: news,    label: News,    i18n: nav_news,    url: "/news/", hidden: true }
